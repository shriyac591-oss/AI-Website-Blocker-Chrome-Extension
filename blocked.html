<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>

Website Blocked

</title>

<style>

body{

background:#121212;

color:white;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

margin:0;

font-family:Arial,sans-serif;

}

.container{

background:#1e1e1e;

padding:35px;

border-radius:15px;

text-align:center;

box-shadow:

0px 0px 15px

rgba(
0,
0,
0,
0.5
);

width:320px;

}

h1{

color:#ef4444;

font-size:35px;

}

p{

font-size:18px;

margin-top:10px;

}

button{

padding:12px 22px;

background:#2563eb;

border:none;

border-radius:8px;

color:white;

cursor:pointer;

font-size:16px;

margin-top:20px;

}

button:hover{

background:#1d4ed8;

}

</style>

</head>

<body>

<div class="container">

<h1>

Website Blocked

</h1>

<p>

Stay Focused 💪

</p>

<button id="backBtn">

Go Back

</button>

</div>

<script>

document
.getElementById(

"backBtn"

)

.addEventListener(

"click",

function(){

chrome.storage.local.get(

"previousPage",

function(data){

window.location.href=

data.previousPage ||

"https://google.com"

;

}

);

}

);

</script>

</body>

</html>
